name: Test Go Scripts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GO_TOOLS_CACHE_VERSION: goimports-0.42.0-gocyclo-0.6.0-gocritic-0.14.3-staticcheck-2025.1.1-golangci-2.12.2
    strategy:
      fail-fast: true
      matrix:
        go-version: ["1.24", "1.25", "1.26"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Restore installed Go tools
        id: go-tools-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/go/bin
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-${{ runner.arch }}-go${{ matrix.go-version }}-tools-${{ env.GO_TOOLS_CACHE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-go${{ matrix.go-version }}-tools-

      - name: Install bats-core
        run: |
          git clone https://github.com/bats-core/bats-core.git
          cd bats-core
          ./install.sh $HOME
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Install Go tools
        if: steps.go-tools-cache.outputs.cache-hit != 'true'
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.42.0
          go install github.com/fzipp/gocyclo/cmd/gocyclo@v0.6.0
          go install github.com/go-critic/go-critic/cmd/go-critic@v0.14.3
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          GOTOOLCHAIN=auto go install \
            github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Make scripts executable
        run: chmod +x run-*.sh

      - name: Run tests
        run: bats tests.bats
